# Configurações da aplicação. O Spring lê este arquivo sozinho na subida.

# Porta pedida no enunciado.
server.port=8080

# Data da prova (Art. 5º, I do regulamento). É o ÚNICO lugar onde ela aparece:
# idade, categoria e as recusas de idade são todas calculadas a partir daqui.
# O áudio fala em "13 de março", mas o regulamento prevalece: 14/03/2027.
corrida.data-prova=2027-03-14

# Fuso usado para saber qual é o dia de "hoje" (nascimento tem que ser anterior a hoje).
# Sem isso, num servidor em UTC, depois das 21h de Brasília "hoje" já seria amanhã.
corrida.fuso=America/Sao_Paulo

# Banco H2 em memória: sobe vazio e é apagado quando a aplicação para.
# DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a aplicação estiver rodando.
# Para guardar os dados entre reinícios, troque por: jdbc:h2:file:./dados/corrida
spring.datasource.url=jdbc:h2:mem:corrida;DB_CLOSE_DELAY=-1

# Tela web do H2 para ver as tabelas no navegador: http://localhost:8080/h2-console
# Use a JDBC URL jdbc:h2:mem:corrida, usuário sa e senha em branco.
spring.h2.console.enabled=true

# O Hibernate cria a tabela a partir da classe Inscricao ao subir e apaga ao desligar.
spring.jpa.hibernate.ddl-auto=create-drop

# Desliga o "open in view": a conexão com o banco fica só dentro do service,
# não durante a escrita do JSON. Também tira um aviso do log na subida.
spring.jpa.open-in-view=false
